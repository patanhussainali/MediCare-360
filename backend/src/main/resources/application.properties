spring.application.name=medicare360
server.port=${PORT:8080}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/medicare360}
spring.data.mongodb.database=${MONGODB_DATABASE:medicare360}

# JWT
jwt.secret=${JWT_SECRET_KEY:changeme-set-in-production-to-at-least-32-chars}
jwt.access-expiry-minutes=60
jwt.refresh-expiry-days=7

# CORS — override via CORS_ALLOWED_ORIGINS env var in production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:3003}

# Password recovery email (Resend)
app.email.resend-api-key=${RESEND_API_KEY:}
app.email.from=${MAIL_FROM:}
app.frontend-url=${FRONTEND_URL:https://medplus360.netlify.app}

# JSON naming — frontend expects snake_case keys
spring.jackson.property-naming-strategy=SNAKE_CASE
