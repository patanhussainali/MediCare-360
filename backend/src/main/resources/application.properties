spring.application.name=medicare360
server.port=${PORT:8080}

# SQLite — resolves absolute path locally or environment variable in production
spring.datasource.url=jdbc:sqlite:${MEDICARE_DB_PATH:data/medicare360.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# JWT — overridden by environment variable JWT_SECRET_KEY
jwt.secret=${JWT_SECRET_KEY:changeme-set-in-production-to-at-least-32-chars}
jwt.access-expiry-minutes=60
jwt.refresh-expiry-days=7

# CORS — override via CORS_ALLOWED_ORIGINS env var in production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:3003}

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.main.allow-bean-definition-overriding=false
